<style>
/* Layout: a working notebook. Rail of worksheets on the left, one sheet open at a time, the brief builds itself at the end. HubForge colours mark the six stages. */
:root{
  --paper:#ffffff; --paper-2:#f5f3f8; --paper-3:#ece8f1; --ink:#1f1d22; --muted:#5e5867; --line:#e4e0ea; --field:#fbfafd;
  --kumkum:#ff5a5a; --haldi:#ffde59; --patta:#7ed957; --jamun:#cb6ce6; --gulal:#ff66c4; --aakash:#5fb7f0;
  --red-ink:#d93b3b; --green-ink:#3d8f1f; --violet-ink:#9a3db8; --on-pig:#1f1d22;
  --f-display:"League Spartan","Arial Black",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#141317; --paper-2:#1c1a20; --paper-3:#25222a; --ink:#f3f1f6; --muted:#a8a1b2; --line:#332f39; --field:#18161c;
  --red-ink:#ff7d7d; --green-ink:#93e26f; --violet-ink:#dc90f2; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#141317; --paper-2:#1c1a20; --paper-3:#25222a; --ink:#f3f1f6; --muted:#a8a1b2; --line:#332f39; --field:#18161c;
  --red-ink:#ff7d7d; --green-ink:#93e26f; --violet-ink:#dc90f2; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.05;text-wrap:balance}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--jamun);outline-offset:2px;border-radius:6px}
.strip{height:5px;background:linear-gradient(90deg,var(--kumkum) 0 16.6%,var(--haldi) 0 33.3%,var(--patta) 0 50%,var(--jamun) 0 66.6%,var(--gulal) 0 83.3%,var(--aakash) 0)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .in{max-width:1240px;margin:0 auto;padding:10px clamp(16px,3vw,32px);display:flex;align-items:center;gap:14px}
.workbook-links{display:flex;align-items:center;gap:8px}
.workbook-links .btn{font-size:12.5px;padding:6px 11px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{height:32px;border-radius:6px;background:#fff;flex:none}
.brand b{font-family:var(--f-display);font-weight:800;font-size:16px;line-height:1.1}
.brand small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.saved{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.saved i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--patta);margin-right:6px;vertical-align:1px}
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:999px;padding:8px 16px;font-weight:700;font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform .15s;white-space:nowrap;text-decoration:none}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.sm{padding:5px 12px;font-size:13.5px}
.btn.warn{border-color:var(--red-ink);color:var(--red-ink);background:transparent}
.shell{max-width:1240px;margin:0 auto;padding:clamp(18px,3vw,32px) clamp(16px,3vw,32px) 64px;display:grid;grid-template-columns:270px minmax(0,1fr);gap:clamp(20px,3vw,40px);align-items:start}
.rail{position:sticky;top:76px;display:grid;gap:14px}
.rail .prog{display:grid;gap:6px}
.rail .prog b{font-family:var(--f-display);font-size:30px;line-height:1}
.rail .prog span{font-size:13px;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--paper-3);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--kumkum),var(--haldi),var(--patta));transition:width .5s}
.nav{display:grid;gap:2px;max-height:calc(100vh - 260px);overflow:auto;padding-right:4px}
.nav .grp{font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:10px 0 2px;display:flex;align-items:center;gap:8px}
.nav .grp i{width:10px;height:10px;border-radius:3px}
.nav button{border:0;background:none;text-align:left;padding:7px 10px;border-radius:10px;cursor:pointer;display:grid;grid-template-columns:38px 1fr auto;gap:6px;align-items:center;font-size:14.5px;color:var(--muted);font-weight:600}
.nav button code{font-family:var(--f-mono);font-size:12px;font-weight:600}
.nav button em{font-style:normal;font-size:11.5px}
.nav button:hover{background:var(--paper-2);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--ink);color:var(--paper)}
.nav button .dot{width:10px;height:10px;border-radius:50%;border:2px solid currentColor;opacity:.6}
.nav button .dot.half{background:linear-gradient(90deg,currentColor 50%,transparent 50%);opacity:.8}
.nav button .dot.full{background:var(--patta);border-color:var(--patta);opacity:1}
.mnav{display:none}
.sheet{min-width:0;display:grid;gap:26px}
.sh-head{display:grid;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:22px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 11px;background:var(--paper-2);border:1px solid var(--line)}
.chip.code{background:var(--c,var(--ink));color:var(--on-pig);border:0;font-family:var(--f-mono)}
.chip.code.plain{background:var(--ink);color:var(--paper)}
.sh-head h1{font-size:clamp(34px,4.6vw,54px);font-weight:900;letter-spacing:-.02em}
.sh-head .goal{font-size:clamp(17px,1.8vw,20px);color:var(--muted);max-width:62ch}
.exbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--paper-2);border-radius:14px;padding:10px 14px}
.toggle{display:inline-flex;gap:10px;align-items:center;cursor:pointer;font-weight:700;font-size:14.5px}
.toggle input{appearance:none;width:40px;height:24px;border-radius:999px;background:var(--paper-3);position:relative;cursor:pointer;transition:background .2s;margin:0;border:1px solid var(--line)}
.toggle input::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.toggle input:checked{background:var(--patta)}
.toggle input:checked::after{transform:translateX(16px)}
.exbar small{color:var(--muted);font-size:13.5px}
.fields{display:grid;gap:24px}
.f{display:grid;gap:8px}
.f>label,.f>.lab{font-weight:700;font-size:15.5px}
.f .hint{font-size:13.5px;color:var(--muted);margin-top:-4px}
input[type=text],textarea,select{width:100%;border:2px solid var(--line);border-radius:12px;background:var(--field);padding:10px 12px;font-size:16px;transition:border-color .2s}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--ink);outline:none}
textarea{min-height:92px;resize:vertical;line-height:1.5}
::placeholder{color:color-mix(in srgb,var(--muted) 70%,transparent);font-style:italic}
.ex-on ::placeholder{color:var(--green-ink);opacity:.85}
.sentence{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;font-family:var(--f-display);font-weight:800;font-size:clamp(20px,2.4vw,26px);line-height:1.3;background:var(--paper-2);border-radius:16px;padding:18px}
.sentence input{width:auto;flex:1 1 180px;font-family:var(--f-body);font-weight:600;font-size:17px;background:var(--paper)}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;transition:border-color .2s,background .2s}
.opt:hover{border-color:var(--ink)}
.opt input{margin-top:4px;accent-color:var(--green-ink);width:18px;height:18px;flex:none}
.opt.on{border-color:var(--patta);background:color-mix(in srgb,var(--patta) 12%,var(--paper))}
.opt.exhint{border-style:dashed;border-color:var(--green-ink)}
.lst{display:grid;gap:8px;counter-reset:l}
.lst div{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:center;counter-increment:l}
.lst div::before{content:counter(l);width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-weight:800;font-size:13px}
.tw{overflow-x:auto;border:2px solid var(--line);border-radius:14px}
table.t{border-collapse:collapse;width:100%;min-width:620px}
table.t th{text-align:left;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:10px 10px 6px;background:var(--paper-2)}
table.t td{padding:4px;border-top:1px solid var(--line)}
table.t input{border:0;border-radius:8px;background:transparent;padding:8px;font-size:15px}
table.t input:focus{background:var(--field);box-shadow:inset 0 0 0 2px var(--ink)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{border:2px solid var(--ink);border-radius:16px;padding:16px;display:grid;gap:10px;background:var(--paper)}
.card h4{font-size:18px;display:flex;justify-content:space-between;align-items:center}
.card h4 span{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:600}
.card label{display:grid;gap:4px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card input{font-size:15px;padding:8px 10px;text-transform:none;letter-spacing:0}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ck{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;font-size:15px;transition:border-color .2s,background .2s}
.ck:hover{border-color:var(--ink)}
.ck input{width:18px;height:18px;accent-color:var(--green-ink);flex:none;margin:0}
.ck.on{border-color:var(--patta);background:color-mix(in srgb,var(--patta) 12%,var(--paper))}
.score{font-family:var(--f-display);font-weight:900;font-size:22px}
.pyr{display:grid;gap:8px;justify-items:center}
.pyr div{width:var(--w);display:grid;gap:4px;background:var(--c);border-radius:14px;padding:10px 12px;color:var(--on-pig);transition:width .3s}
.pyr div b{font-family:var(--f-display);font-size:16px}
.pyr input{background:rgba(255,255,255,.88);border-color:transparent;color:#1f1d22}
.wire{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.blocks{display:grid;gap:8px}
.blk{display:grid;grid-template-columns:1fr 120px 34px;gap:6px;align-items:center}
.blk select{padding:9px 8px}
.blk button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:none;cursor:pointer;font-weight:800}
.blk button:hover{border-color:var(--red-ink);color:var(--red-ink)}
.prev{border:2px solid var(--ink);border-radius:14px;padding:12px;display:grid;grid-template-columns:repeat(12,1fr);gap:6px;align-content:start;min-height:260px;background:var(--paper);position:relative}
.prev .b{border-radius:8px;background:var(--paper-3);padding:8px;font-size:12px;font-weight:600;min-height:44px;display:flex;align-items:flex-end;overflow-wrap:anywhere}
.prev .b.first{background:color-mix(in srgb,var(--kumkum) 28%,var(--paper));}
.prev .empty{grid-column:1/-1;color:var(--muted);font-size:14px;align-self:center;text-align:center}
.prev-cap{font-size:12.5px;color:var(--muted);margin-top:6px}
.crow{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:2px solid var(--line);border-radius:14px;padding:12px}
.crow .sug{grid-column:1/-1;font-size:13.5px;color:var(--muted);background:var(--paper-2);border-radius:10px;padding:8px 10px}
.crow .sug b{color:var(--ink)}
.crow .ttl{grid-column:1/-1}
.ai{display:grid;gap:10px;border-top:2px dashed var(--line);padding-top:22px}
.ai .lab{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.bub{justify-self:end;max-width:min(92%,640px);background:var(--ink);color:var(--paper);border-radius:16px 16px 4px 16px;padding:12px 16px;font-size:15.5px}
.bub small{display:block;font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.65;margin-bottom:2px}
.bub mark{background:color-mix(in srgb,var(--haldi) 55%,transparent);color:inherit;border-radius:3px;padding:0 2px}
.airow{display:flex;gap:14px;justify-content:flex-end;flex-wrap:wrap;align-items:center;font-size:14px}
.airow .push{color:var(--red-ink);font-style:italic;font-weight:600}
.linkbtn{border:0;background:none;padding:0;font-weight:700;font-size:14px;color:var(--violet-ink);cursor:pointer;border-bottom:2px solid currentColor}
.team{border-left:4px solid var(--aakash);padding:4px 0 4px 14px;font-style:italic;font-weight:600;color:var(--muted)}
.team b{font-style:normal;color:var(--ink)}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:2px solid var(--ink);padding-top:20px}
.pager .nx{margin-left:auto}
/* brief */
.brief{display:grid;gap:22px}
.brief .doc{border:2px solid var(--ink);border-radius:18px;padding:clamp(18px,3vw,32px);display:grid;gap:18px;background:var(--paper)}
.brief .doc h2{font-size:clamp(28px,3.6vw,40px)}
.brief .ps{font-family:var(--f-display);font-weight:800;font-size:clamp(20px,2.4vw,26px);line-height:1.3;background:linear-gradient(transparent 62%,color-mix(in srgb,var(--haldi) 70%,transparent) 62%)}
.brief .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.brief .grid div{border-top:3px solid var(--ink);padding-top:8px}
.brief .grid small,.brief h4 small{display:block;font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.brief h4{font-size:19px;margin-bottom:6px}
.brief ul{margin:0;padding-left:20px;display:grid;gap:4px}
.brief .miss{color:var(--muted);font-style:italic}
.brief .scores{display:flex;gap:24px;flex-wrap:wrap}
.brief .scores b{font-family:var(--f-display);font-size:34px;display:block;line-height:1}
.brief table{border-collapse:collapse;width:100%;font-size:14.5px;min-width:560px}
.brief th{text-align:left;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px;border-bottom:2px solid var(--ink)}
.brief td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--kumkum) 12%,var(--paper));border-radius:12px;padding:10px 14px;font-weight:600}
.note{font-size:13.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,150%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;transition:transform .3s;z-index:50}
.toast.on{transform:translate(-50%,0)}
.welcome{background:var(--paper-2);border-radius:18px;padding:clamp(16px,2.6vw,26px);display:grid;gap:12px}
.welcome h3{font-size:22px}
.agenda{width:100%;border-collapse:collapse;font-size:14.5px;min-width:520px}
.agenda td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:top}
.agenda td:first-child{font-family:var(--f-mono);font-weight:600;white-space:nowrap}
.agenda td:nth-child(2){font-weight:700}
@media (prefers-reduced-motion:no-preference){.sheet>*{animation:rise .4s ease both}.sheet>*:nth-child(2){animation-delay:.04s}.sheet>*:nth-child(3){animation-delay:.08s}@keyframes rise{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}}
@media (max-width:920px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:static}
  .rail .nav{display:none}
  .mnav{display:block}
  .cards,.checks,.wire,.brief .grid{grid-template-columns:minmax(0,1fr)}
  .saved span{display:none}
}
@media (max-width:560px){
  .top .in{flex-wrap:wrap;gap:8px}
  .brand{flex:1 1 150px}
  .brand small{display:none}
  .crow{grid-template-columns:minmax(0,1fr)}
  .blk{grid-template-columns:1fr 104px 34px}
  .top .btn span{display:none}
  .workbook-links{gap:5px}
  .workbook-links .btn{font-size:11px;padding:6px 8px}
}

/* v2: help, examples, scenario, responsive tables, tools */
.card label .lr{display:flex;gap:6px;align-items:center}
.toast{visibility:hidden}
.toast.on{visibility:visible}
.lab-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qb{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);background:none;color:var(--muted);font-weight:800;font-size:12px;line-height:1;cursor:pointer;display:inline-grid;place-items:center;padding:0;flex:none}
.qb:hover,.qb[aria-expanded="true"]{border-color:var(--ink);color:var(--paper);background:var(--ink)}
.helptx{font-size:14px;background:color-mix(in srgb,var(--aakash) 16%,var(--paper));border-radius:10px;padding:8px 12px;max-width:68ch}
.helptx b{font-weight:800}
.exl{font-size:13.5px;color:var(--green-ink);font-weight:600}
.exl b{font-weight:800;letter-spacing:.04em}
details.exd{border:2px dashed color-mix(in srgb,var(--green-ink) 55%,transparent);border-radius:14px;padding:4px 14px}
details.exd summary{cursor:pointer;font-weight:700;font-size:14.5px;color:var(--green-ink);padding:8px 0}
details.exd .exc{padding:4px 0 12px;font-size:14px;display:grid;gap:6px}
details.exd table{border-collapse:collapse;width:100%;font-size:13.5px}
details.exd th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:4px 6px;border-bottom:1px solid var(--line)}
details.exd td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.exwrap{overflow-x:auto}
.scen{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.scen button{text-align:left;border:2px solid var(--line);border-radius:14px;background:var(--paper);padding:12px 14px;cursor:pointer;display:grid;gap:3px;transition:border-color .2s,background .2s}
.scen button:hover{border-color:var(--ink)}
.scen button[aria-pressed="true"]{border-color:var(--patta);background:color-mix(in srgb,var(--patta) 12%,var(--paper))}
.scen b{font-family:var(--f-display);font-size:17px}
.scen span{font-size:13.5px;color:var(--muted)}
.banner{border-radius:14px;padding:12px 16px;background:color-mix(in srgb,var(--haldi) 22%,var(--paper));display:grid;gap:4px;font-size:14.5px}
.banner b{font-weight:800}
.banner code{font-family:var(--f-mono);font-size:12.5px;background:var(--paper);border-radius:6px;padding:1px 6px;margin:2px 2px 0 0;display:inline-block}
.tbl{display:grid;border:2px solid var(--line);border-radius:14px;overflow:hidden}
.tbl .tr{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));border-top:1px solid var(--line)}
.tbl .th{background:var(--paper-2);border-top:0}
.tbl .th span{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:10px 10px 6px}
.tbl .td{padding:4px;display:grid;min-width:0}
.tbl .td+.td{border-left:1px solid var(--line)}
.tbl .cl{display:none}
.tbl input,.tbl select{border:0;border-radius:8px;background:transparent;padding:8px;font-size:15px;min-width:0}
.tbl input:focus,.tbl select:focus{background:var(--field);box-shadow:inset 0 0 0 2px var(--ink)}
.bring{justify-self:start}
.ccheck{display:grid;grid-template-columns:auto auto 1fr;gap:12px 16px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:14px}
.ccheck label{display:flex;gap:8px;align-items:center;font-weight:700;font-size:14.5px}
.ccheck input[type=color]{width:44px;height:34px;border:2px solid var(--line);border-radius:8px;padding:2px;background:var(--paper);cursor:pointer}
.ccheck .sample{grid-column:1/-1;border-radius:10px;padding:12px 14px;font-size:16px;font-weight:600}
.ccheck .res{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ccheck .ratio{font-family:var(--f-display);font-weight:900;font-size:26px}
.pf{font-size:12.5px;font-weight:800;border-radius:999px;padding:3px 10px}
.pf.ok{background:color-mix(in srgb,var(--patta) 35%,var(--paper))}
.pf.no{background:color-mix(in srgb,var(--kumkum) 30%,var(--paper))}
.blk{grid-template-columns:1fr 112px 30px 30px 30px!important}
.blk button{width:30px!important;height:30px!important}
.welcome .steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.welcome .steps div{background:var(--paper);border-radius:14px;padding:14px;display:grid;gap:4px}
.welcome .steps b{font-family:var(--f-display);font-size:28px;color:var(--red-ink);line-height:1}
.welcome .steps h4{font-size:17px}
.welcome .steps p{font-size:14.5px;color:var(--muted)}
.cta{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.next{border:2px solid var(--ink);border-radius:18px;padding:clamp(16px,2.6vw,24px);display:grid;gap:12px;background:color-mix(in srgb,var(--patta) 10%,var(--paper))}
.next h3{font-size:22px}
.next pre{white-space:pre-wrap;font-family:var(--f-mono);font-size:13px;background:var(--paper);border-radius:10px;padding:12px;max-height:200px;overflow:auto;margin:0}
.unf{font-size:13px;color:var(--muted)}
@media (max-width:640px){
  .tbl .th{display:none}
  .tbl .tr{grid-template-columns:minmax(0,1fr);padding:8px 6px;gap:2px}
  .tbl .tr+.tr{border-top:2px solid var(--line)}
  .tbl .td+.td{border-left:0}
  .tbl .cl{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 8px 0}
  .tbl .tr .td:first-child input{font-weight:700}
  .tbl input,.tbl select{background:var(--field);border:1px solid var(--line)}
  .scen,.welcome .steps{grid-template-columns:minmax(0,1fr)}
  .ccheck{grid-template-columns:1fr 1fr}
  .ccheck .res{grid-column:1/-1}
  .blk{grid-template-columns:1fr 96px 30px 30px 30px!important;gap:4px!important}
}

.trk{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0 8px}
.trk button{display:grid;gap:4px;text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:18px;padding:16px;cursor:pointer;font:inherit;color:inherit;transition:transform .2s,border-color .2s}
.trk button:hover{transform:translateY(-2px);border-color:var(--ink)}
.trk button[aria-pressed="true"]{border-color:var(--ink);box-shadow:5px 5px 0 #5fb7f0}
.trk button[data-trk="eval"][aria-pressed="true"]{box-shadow:5px 5px 0 #ff5a5a}
.trk small{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.trk b{font-family:var(--f-display);font-size:22px}
.trk span{font-size:14.5px;color:var(--muted)}
@media (max-width:640px){.trk{grid-template-columns:1fr}}
.linkbtn{font:inherit;font-weight:700;background:none;border:0;padding:0;cursor:pointer;color:inherit;text-decoration:underline}
</style>

    L.push(`# ${b.name || 'Survey brief'}`, ''); if (b.field || b.owner) L.push(`${b.field || ''}${b.field && b.owner ? ' · ' : ''}${b.owner ? 'Owner: ' + b.owner : ''}`, '');
    L.push(`Kind: ${b.kind}`, ''); L.push(`Respondents: ${b.resp || '(not set)'}. Mode: ${b.mode || '(not set)'}${b.mins ? '. Target length: ' + b.mins : ''}`, '');
    if (b.dec.length) { L.push('## Decisions and indicators'); b.dec.forEach((r) => L.push(`- ${r[0] || ''}${r[1] ? ' (' + r[1] + ')' : ''}: ${r[2] || ''}${r[3] ? '. Table: ' + r[3] : ''}`)); L.push(''); }
    if (b.qs.length) { L.push('## Questions'); b.qs.forEach((r, i) => L.push(`${i + 1}. ${r[1]}${r[0] ? ' [' + r[0] + ']' : ''}${r[2] ? ' (' + r[2] + ')' : ''}`)); L.push(''); }
    if (b.langs) L.push(`Languages: ${b.langs}`, '');
    if (b.script) L.push('## Consent script', b.script, '');
    if (b.pii.length) { L.push('## Personal details'); b.pii.forEach((r) => L.push(`- ${r[0]}: ${r[1] || ''}; ${r[2] || ''}`)); L.push(''); }
    if (b.pilot) L.push(`Pilot: ${b.pilot}${b.time ? ', median ' + b.time : ''}`, '');
    if (b.fixes.length) { L.push('## Fixes after the pilot'); b.fixes.forEach((x) => L.push('- ' + x)); L.push(''); }
    if (b.reach) L.push('## Reaching everyone', b.reach, ''); if (b.train || b.codebook || b.loop) { L.push('## Fieldwork and data'); if (b.train) L.push('- Training: ' + b.train); if (b.codebook) L.push('- Codebook: ' + b.codebook); if (b.loop) L.push('- Results back to people: ' + b.loop); L.push(''); }
    L.push(`Ready to launch: ${b.ready}/${b.nready} · Field checks: ${b.fchk}/6`, '', 'Made with the Designing Surveys and Forms with AI Workbook, HubForge. www.hubforgeglobal.com');
    return L.join('\n');
  }
  const buildPrompt = () => 'You are helping me build a data collection form. Here is the agreed brief. Using only what it says, write the XLSForm survey, choices and settings sheets, with snake_case names, ${name} references in every rule, and constraints on every number. Then list every assumption you made and anything unclear or missing. Do not add questions.\n\n' + briefMd();
  let downloads = null;
  function renderBrief() {
    const b = briefData(); const x = xlsform();
    const drow = b.dec.map((r) => `<tr><td><b>${esc(r[0] || '')}</b></td><td>${esc(r[1] || '')}</td><td>${esc(r[2] || '')}</td></tr>`).join('');
    $('#sheet').innerHTML = `<header class="sh-head"><div class="chips"><span class="chip code plain">Brief</span><span class="chip">Builds itself from your answers</span></div><h1>Your survey brief.</h1><p class="goal">One page your team can agree on before fieldwork, and a draft XLSForm built from sheets U1, R1 and V1. Grey lines show what is still missing.</p></header>
    <div class="tools"><button class="btn" type="button" id="cpMd">Copy the brief as text</button><button class="btn ghost" type="button" id="dlMd" hidden>Download the brief (.md)</button><button class="btn ghost" type="button" id="dlJson" hidden>Save answers to a file</button><label class="btn ghost" for="ldJson" style="cursor:pointer">Load answers from a file</label><input type="file" id="ldJson" accept=".json,application/json" hidden></div>
    <div class="brief"><article class="doc">
      <div><p class="note"><b>${esc(b.kind)}</b> · ${miss(b.field, 'Field not set')} · Owner: ${miss(b.owner, 'not set')}</p><h2>${miss(b.name, 'Untitled survey')}</h2></div>
      <div class="grid"><div><small>Respondents</small>${miss(b.resp)}</div><div><small>Mode</small>${miss(b.mode)}</div><div><small>Target length</small>${miss(b.mins)}</div></div>
      ${b.data ? `<p class="note"><b>Practice scenario:</b> ${esc(b.data)}</p>` : ''}
      <div><h4>Decisions and indicators</h4>${drow ? `<div style="overflow-x:auto"><table><tr><th>Decision</th><th>Who and when</th><th>Indicator</th></tr>${drow}</table></div>` : '<p class="miss">Fill them in on sheet S1.</p>'}${b.cut ? `<p class="note" style="margin-top:6px">${b.cut} draft question${b.cut > 1 ? 's' : ''} cut on S2.</p>` : ''}</div>
      <div><h4>Questions</h4>${b.qs.length ? `<ol>${b.qs.map((r) => `<li>${esc(r[1])} <span class="note">${esc(r[2] || '')}</span></li>`).join('')}</ol>` : '<p class="miss">Write them on sheet U1.</p>'}</div>
      <div class="grid"><div><small>Languages</small>${miss(b.langs)}</div><div><small>Pilot</small>${miss(b.pilot)}</div><div><small>Median time</small>${miss(b.time)}</div></div>
      <div><h4>What people are told</h4><p>${miss(b.script, 'Write it on sheet E2.')}</p></div>
      <div class="grid"><div><small>Who could be missed</small>${miss(b.reach, 'Sheet E3')}</div><div><small>Training</small>${miss(b.train, 'Sheet Y3')}</div><div><small>Results back to people</small>${miss(b.loop, 'Sheet Y3')}</div></div>
      <div class="scores"><div><b>${b.ready}/${b.nready}</b><small class="note">ready to launch</small></div><div><b>${b.fchk}/6</b><small class="note">field checks set up</small></div><div><b>${x.n}</b><small class="note">questions in the XLSForm</small></div></div>
    </article>
    <section class="next"><h3>Your draft XLSForm</h3><p>Built from U1 (questions and types), R1 (options and ranges) and V1 (logic). Upload it to KoboToolbox, ODK or SurveyCTO and test it on a phone; the tool will report anything it cannot read.</p>
      <div class="xtabs" role="tablist" style="display:flex;gap:6px">${['survey', 'choices', 'settings'].map((t, i) => `<button type="button" class="btn sm ${i ? 'ghost' : ''}" data-x="${t}">${t}</button>`).join('')}</div>
      <div class="exwrap" id="xtbl" style="max-height:320px;overflow:auto;border:2px solid var(--ink);border-radius:12px;background:var(--paper)"></div>
      <p class="note" id="xwarn"></p>
      <div class="tools"><button class="btn" type="button" id="xcopy">Copy this sheet</button><button class="btn ghost" type="button" id="xdl" hidden>Download the XLSForm (.xlsx)</button></div></section>
    <section class="next"><h3>Or ask AI to build it</h3><p>Paste this into Claude, ChatGPT, Gemini or Copilot. It asks the AI to build only from your brief, list its assumptions, and add no questions.</p><pre id="bp"></pre><div class="tools"><button class="btn" type="button" id="cpBp">Copy the build prompt</button></div></section>
    <div class="tools" id="dangerZone"><button class="btn sm warn" type="button" id="clearAll">Clear all my answers</button></div>
    <p class="note">Answers live in this browser only. Nobody else can see them, including HubForge.</p></div>
    <nav class="pager"><button class="btn ghost" type="button" data-go="${W[W.length - 1].id}">← ${esc(W[W.length - 1].code)} ${esc(W[W.length - 1].title)}</button></nav>`;
    let tab = 'survey';
    const drawX = () => { const rows = x[tab]; $('#xtbl').innerHTML = `<table style="font-family:var(--f-mono);font-size:12.5px;min-width:100%"><tr>${rows[0].map((h) => `<th>${esc(h)}</th>`).join('')}</tr>${rows.slice(1).map((r) => `<tr>${r.map((c) => `<td style="white-space:nowrap">${esc(c)}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${rows[0].length}" class="miss">Nothing yet. Fill in sheet U1.</td></tr>`}</table>`; $$('[data-x]').forEach((bt) => bt.classList.toggle('ghost', bt.dataset.x !== tab)); };
    $$('[data-x]').forEach((bt) => bt.addEventListener('click', () => { tab = bt.dataset.x; drawX(); }));
    drawX(); $('#xwarn').textContent = x.warn.length ? 'Check: ' + x.warn.join(' ') : (x.n ? 'No problems found in names, options or logic.' : '');
    $('#bp').textContent = buildPrompt();
    $('#cpMd').addEventListener('click', () => copy(briefMd(), 'Brief copied'));
    $('#cpBp').addEventListener('click', () => copy(buildPrompt(), 'Build prompt copied'));
    $('#xcopy').addEventListener('click', () => copy(x[tab].map((r) => r.join('\t')).join('\n'), 'Sheet copied. Paste it into a tab named ' + tab));
    const stamp = new Date().toISOString().slice(0, 10);
    const saveFile = async (name, data, mime) => { if (downloads) return downloads.save({ filename: name, data: new Blob([data], { type: mime }) }); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: mime })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); };
    const canDl = downloads || !window.claude;
    if (canDl) { $('#dlMd').hidden = false; $('#dlJson').hidden = false; if (window.XLSX) $('#xdl').hidden = false;
      $('#dlMd').addEventListener('click', async () => { try { await saveFile(`survey-brief-${stamp}.md`, briefMd(), 'text/markdown'); } catch (e) { toast('Download did not finish. Copy the brief instead.'); } });
      $('#dlJson').addEventListener('click', async () => { try { await saveFile(`survey-workbook-answers-${stamp}.json`, JSON.stringify({ app: 'dsfai-workbook', v: S.v, ai: S.ai, scen: S.scen, track: S.track }, null, 1), 'application/json'); } catch (e) { toast('Save did not finish.'); } });
      $('#xdl').addEventListener('click', async () => { try { const wb = XLSX.utils.book_new(); ['survey', 'choices', 'settings'].forEach((n) => XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(x[n]), n)); await saveFile(`${slug(b.name || 'my_survey')}_xlsform.xlsx`, XLSX.write(wb, { bookType: 'xlsx', type: 'array' }), 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'); } catch (e) { toast('Download did not finish. Copy each sheet instead.'); } }); }
    $('#ldJson').addEventListener('change', (e) => { const file = e.target.files[0]; if (!file) return; const r = new FileReader(); r.onload = () => { try { const d = JSON.parse(r.result); if (!d || d.app !== 'dsfai-workbook') throw 0; S.v = d.v || {}; S.ai = d.ai || {}; S.scen = d.scen; S.track = d.track; save(); refreshProgress(); render(); toast('Answers loaded'); } catch (x2) { toast('That file is not a workbook answers file.'); } }; r.readAsText(file); });
    $('#clearAll').addEventListener('click', () => { $('#dangerZone').innerHTML = `<div class="confirm">Clear every answer in this workbook? This cannot be undone. <button class="btn sm warn" type="button" id="yesClear">Yes, clear them</button><button class="btn sm ghost" type="button" id="noClear">Keep them</button></div>`;
      $('#yesClear').addEventListener('click', () => { S.v = {}; S.ai = {}; S.scen = undefined; save(); refreshProgress(); render(); toast('All answers cleared'); }); $('#noClear').addEventListener('click', () => render()); });
  }
  function render() {
    if (S.cur === 'welcome') renderWelcome(); else if (S.cur === 'brief') renderBrief(); else { const w = W.find((x) => x.id === S.cur) || W[0]; S.cur = w.id; renderSheet(w); }
    $$('#sheet [data-go]').forEach((b) => b.addEventListener('click', () => go(b.dataset.go)));
    $$('#nav button').forEach((b) => b.setAttribute('aria-current', String(b.dataset.w === S.cur))); $('#mnav').value = S.cur;
  }
  buildNav(); refreshProgress(); render();
  (async () => { try { if (window.claude && claude.use) { downloads = await claude.use('downloads'); if (S.cur === 'brief') render(); } } catch (e) { downloads = null; } })();
})();

</script>
